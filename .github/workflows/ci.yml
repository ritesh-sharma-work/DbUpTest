name: Database Migration CI & Additive Policy Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-additive-migrations:
    name: Validate Additive-Only Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Migration Scripts
        shell: pwsh
        run: |
          ./.github/scripts/validate-migrations.ps1 -ScriptsFolder "./scripts"

  build-and-run:
    name: Build & Test Migration Runner
    needs: validate-additive-migrations
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong!Password123'
        ports:
          - 1433:1433
        options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -Q 'SELECT 1' -C" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore DbUp.csproj

      - name: Build Project
        run: dotnet build DbUp.csproj --configuration Release --no-restore

      - name: Execute DbUp Migration Runner
        run: |
          dotnet run --project DbUp.csproj --configuration Release -- "Server=127.0.0.1,1433;Database=DbUpTestDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"
