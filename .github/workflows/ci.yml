name: Database Migration CI/CD & Additive Policy Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-additive-migrations:
    name: Validate Additive-Only Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Migration Scripts
        shell: pwsh
        run: |
          ./.github/scripts/validate-migrations.ps1 -ScriptsFolder "./scripts"

  test-migration-on-container:
    name: Test Migration on SQL Container
    needs: validate-additive-migrations
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong!Password123'
        ports:
          - 1433:1433
        options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -Q 'SELECT 1' -C" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore DbUp.csproj

      - name: Build Project
        run: dotnet build DbUp.csproj --configuration Release --no-restore

      - name: Execute DbUp Migration Runner (Container Test)
        run: |
          dotnet run --project DbUp.csproj --configuration Release -- "Server=127.0.0.1,1433;Database=DbUpTestDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"

  deploy-to-production-db:
    name: Deploy Migrations to Target Database
    needs: [validate-additive-migrations, test-migration-on-container]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore DbUp.csproj

      - name: Build Project
        run: dotnet build DbUp.csproj --configuration Release --no-restore

      - name: Execute DbUp Migration Runner against Target DB
        env:
          CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "Error: PROD_DB_CONNECTION_STRING secret is missing in GitHub repository settings!"
            echo "Please configure PROD_DB_CONNECTION_STRING under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          dotnet run --project DbUp.csproj --configuration Release -- "$CONNECTION_STRING"
